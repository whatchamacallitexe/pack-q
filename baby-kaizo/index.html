		#startButton {

			cursor: pointer;
		}
	</style>

<body>
	<div id="game"></div>
	<button id="startButton">Start Game</button>
	<script>
		var gameUrl = "https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/baby-kaizo/index.html";
		document.getElementById('startButton').onclick = function() {
			document.getElementById('game').innerHTML = '<iframe src="' + gameUrl + '" width="100%" height="100%" style="border:none;position:fixed;top:0;left:0;"></iframe>';
			this.style.display = 'none';
		};
	</script>
